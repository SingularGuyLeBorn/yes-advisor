    - paragraph [ref=e363]: "师兄: 让这个式子显得有必要."
  - generic [ref=e364]:
    - paragraph [ref=e365]: "我: 师兄,组会汇报有什么技巧?"
    - paragraph [ref=e366]: "师兄: 记住,组会只有一个正确答案:「快了」."
    - paragraph [ref=e367]: "我: 那要是真做完了呢?"
    - paragraph [ref=e368]: "师兄: 那你的麻烦就大了."
  - generic [ref=e369]:
    - paragraph [ref=e370]: "我: 审稿人让补的实验至少得做一年,这怎么改?"
    - paragraph [ref=e371]: "师兄: 修改意见的关键不是「改」,是「看起来改了」."
    - paragraph [ref=e372]: "我: 怎么叫看起来改了?"
    - paragraph [ref=e373]: "师兄: Response 开头感谢他富有洞察力的批评,把柱状图改成散点图,坐标轴字体从 Arial 换成 Helvetica,讨论里加一句「诚如审稿人所言」."
    - paragraph [ref=e374]: "我: 这对实质回应吗?"
    - paragraph [ref=e375]: "师兄: 没有.但审稿人审你的稿子不收钱,他图什么?图成就感.让他觉得自己推动了科学进步,比让他看到正确的数据重要得多."
    - paragraph [ref=e376]: "我: 那科学进步怎么办?"
    - paragraph [ref=e377]: "师兄: 那是下一篇稿子的事."
  - generic [ref=e378]:
    - paragraph [ref=e379]: "我: 导师在推荐信里夸我「富有独立精神」,这评价是不是很高?"
    - paragraph [ref=e380]: "师兄: 我给你一本导师词典.「富有独立精神」:从来不听安排;「踏实肯干」:做不出来,但不敢不做;「思维活跃」:一学期换了八个方向;「潜力巨大」:目前一无所有;「年轻有为」:还没学会说不."
    - paragraph [ref=e381]: "我: 那导师最真心的夸奖是什么?"
    - paragraph [ref=e382]: "师兄: 「好用」.意思是:又快,又不问为什么."
  - generic [ref=e383]:
    - paragraph [ref=e384]: "我: 李教授要跳槽去南方的消息,你怎么比学院还早知道?"
    - paragraph [ref=e385]: "师兄: 学术消息按传播渠道分三级.期刊上发表的,是旧闻;会议上宣布的,是新闻;茶歇上说的,是真相."
    - paragraph [ref=e386]: "我: 那卫生间里说的呢?"
    - paragraph [ref=e387]: "师兄: 那是任命文件,只是还没公示."
  - generic [ref=e388]:
    - paragraph [ref=e389]: "我: 今年经费还剩三十万,导师急得天天开会."
    - paragraph [ref=e390]: "师兄: 经费的第一属性不是用来做研究,是必须被花完.今年剩三十万,明年预算就砍三十万;今年花完三十万,明年才能报五十万."
    - paragraph [ref=e391]: "我: 那到底花在哪儿?"
    - paragraph [ref=e392]: "师兄: 花在年底之前."