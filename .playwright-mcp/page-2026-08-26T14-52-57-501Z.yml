  - generic [ref=f1e2]:
    - paragraph [ref=f1e3]: "我: 导师说我的报销单他「会考虑一下」,这都三个月了."
    - paragraph [ref=f1e4]: "师兄: 你不懂导师的措辞体系.「我考虑一下」,意思是单子已经找不到了;「我认真考虑一下」,意思是他正在找."
    - paragraph [ref=f1e5]: "我: 那「我已经考虑过了」呢?"
    - paragraph [ref=f1e6]: "师兄: 意思是你再也见不到它了."
  - generic [ref=f1e7]:
    - paragraph [ref=f1e8]: "我: 答辩的时候专家问了我一个完全答不上来的问题,我卡了半分钟."
    - paragraph [ref=f1e9]: "师兄: 你犯了答辩的大忌:试图回答问题."
    - paragraph [ref=f1e10]: "我: 不回答问题,回答什么?"
    - paragraph [ref=f1e11]: "师兄: 回答你准备好的问题.专家问「为什么这样设计对照组」,你就说「这个问题非常关键,但我想先请各位专家关注一个更根本的问题」,然后把你背熟的机制讲一遍."
    - paragraph [ref=f1e12]: "我: 这不就是答非所问吗?"
    - paragraph [ref=f1e13]: "师兄: 答辩的目的不是让专家得到答案,是让专家得到满足感.他提出的问题证明了他的水平,你给出的态度证明了你的教养,双方各取所需."
    - paragraph [ref=f1e14]: "我: 那我的问题呢?"
    - paragraph [ref=f1e15]: "师兄: 你没有问题.你是被审查的那个,你只有态度."
  - generic [ref=f1e16]:
    - paragraph [ref=f1e17]: "我: 导师让我每周汇报一篇文献,可我根本没时间看,怎么办?"
    - paragraph [ref=f1e18]: "师兄: 汇报文献不需要看文献.摘要的第一句加最后一句,中间的机制部分用「作者进一步探究了」一笔带过,最后点评一句「对我们很有启发」."
    - paragraph [ref=f1e19]: "我: 导师不会发现我没看吗?"
    - paragraph [ref=f1e20]: "师兄: 放心,他也没看.这个制度能运转这么多年,靠的就是双方都坚信对方看了."
