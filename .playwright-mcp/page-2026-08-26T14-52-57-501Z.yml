    - paragraph [ref=f1e362]: "我: 那样本量的作用是什么?"
    - paragraph [ref=f1e363]: "师兄: 让这个式子显得有必要."
  - generic [ref=f1e364]:
    - paragraph [ref=f1e365]: "我: 师兄,组会汇报有什么技巧?"
    - paragraph [ref=f1e366]: "师兄: 记住,组会只有一个正确答案:「快了」."
    - paragraph [ref=f1e367]: "我: 那要是真做完了呢?"
    - paragraph [ref=f1e368]: "师兄: 那你的麻烦就大了."
  - generic [ref=f1e369]:
    - paragraph [ref=f1e370]: "我: 审稿人让补的实验至少得做一年,这怎么改?"
    - paragraph [ref=f1e371]: "师兄: 修改意见的关键不是「改」,是「看起来改了」."
    - paragraph [ref=f1e372]: "我: 怎么叫看起来改了?"
    - paragraph [ref=f1e373]: "师兄: Response 开头感谢他富有洞察力的批评,把柱状图改成散点图,坐标轴字体从 Arial 换成 Helvetica,讨论里加一句「诚如审稿人所言」."
    - paragraph [ref=f1e374]: "我: 这对实质回应吗?"
    - paragraph [ref=f1e375]: "师兄: 没有.但审稿人审你的稿子不收钱,他图什么?图成就感.让他觉得自己推动了科学进步,比让他看到正确的数据重要得多."
    - paragraph [ref=f1e376]: "我: 那科学进步怎么办?"
    - paragraph [ref=f1e377]: "师兄: 那是下一篇稿子的事."
  - generic [ref=f1e378]:
    - paragraph [ref=f1e379]: "我: 导师在推荐信里夸我「富有独立精神」,这评价是不是很高?"
    - paragraph [ref=f1e380]: "师兄: 我给你一本导师词典.「富有独立精神」:从来不听安排;「踏实肯干」:做不出来,但不敢不做;「思维活跃」:一学期换了八个方向;「潜力巨大」:目前一无所有;「年轻有为」:还没学会说不."
    - paragraph [ref=f1e381]: "我: 那导师最真心的夸奖是什么?"
    - paragraph [ref=f1e382]: "师兄: 「好用」.意思是:又快,又不问为什么."
  - generic [ref=f1e383]:
    - paragraph [ref=f1e384]: "我: 李教授要跳槽去南方的消息,你怎么比学院还早知道?"
    - paragraph [ref=f1e385]: "师兄: 学术消息按传播渠道分三级.期刊上发表的,是旧闻;会议上宣布的,是新闻;茶歇上说的,是真相."
    - paragraph [ref=f1e386]: "我: 那卫生间里说的呢?"
    - paragraph [ref=f1e387]: "师兄: 那是任命文件,只是还没公示."
  - generic [ref=f1e388]:
    - paragraph [ref=f1e389]: "我: 今年经费还剩三十万,导师急得天天开会."
    - paragraph [ref=f1e390]: "师兄: 经费的第一属性不是用来做研究,是必须被花完.今年剩三十万,明年预算就砍三十万;今年花完三十万,明年才能报五十万."
    - paragraph [ref=f1e391]: "我: 那到底花在哪儿?"
    - paragraph [ref=f1e392]: "师兄: 花在年底之前."